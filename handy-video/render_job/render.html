<html><head><meta charset="utf-8">
<style>

<body>
<canvas id="out" width="1080" height="1920"></canvas>
<canvas id="gl" width="1080" height="1920"></canvas>
<script>
'use strict';
const OW=1080, OH=1920, MW=540, MH=960;
const FONT='Inter, "Inter Display", sans-serif';
// ------------------------------------------------------------ math
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.hypot(a[0],a[1],a[2]);
const norm=a=>mul(a,1/len(a));
const lerp=(a,b,u)=>a+(b-a)*u;
const lerp3=(a,b,u)=>[lerp(a[0],b[0],u),lerp(a[1],b[1],u),lerp(a[2],b[2],u)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sstep=(a,b,x)=>{const u=clamp((x-a)/(b-a),0,1);return u*u*(3-2*u);};
const ease=u=>{u=clamp(u,0,1);return u*u*(3-2*u);};
const easeIO=u=>{u=clamp(u,0,1);return u<0.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;};
const easeQ=u=>{u=clamp(u,0,1);return u<0.5?16*u*u*u*u*u:1-Math.pow(-2*u+2,5)/2;};
const loglerp=(a,b,u)=>Math.exp(lerp(Math.log(a),Math.log(b),u));
const D2R=Math.PI/180;

// ------------------------------------------------------------ phone UI texture
const UIW=600, UIH=1276;
const ui=document.createElement('canvas'); ui.width=UIW; ui.height=UIH;
const uc=ui.getContext('2d');
const KEYS={};
(function layout(){
  const r1='qwertzuiopü', r2='asdfghjklöä', r3='yxcvbnm';
  const kw=48, kh=84; const ys=[852, 952, 1052, 1152];
  for(let i=0;i<11;i++) KEYS[r1[i]]={x:6+i*54,y:ys[0]-kh/2,w:kw,h:kh,label:r1[i].toUpperCase(),type:'l'};
  for(let i=0;i<11;i++) KEYS[r2[i]]={x:6+i*54,y:ys[1]-kh/2,w:kw,h:kh,label:r2[i].toUpperCase(),type:'l'};
  KEYS['shift']={x:6,y:ys[2]-kh/2,w:72,h:kh,label:'',type:'s'};
  for(let i=0;i<7;i++) KEYS[r3[i]]={x:114+i*54,y:ys[2]-kh/2,w:kw,h:kh,label:r3[i].toUpperCase(),type:'l'};
  KEYS['back']={x:522,y:ys[2]-kh/2,w:72,h:kh,label:'',type:'s'};
  KEYS['123']={x:6,y:ys[3]-kh/2,w:104,h:kh,label:'123',type:'s'};
  KEYS['emo']={x:116,y:ys[3]-kh/2,w:64,h:kh,label:'',type:'s'};
  KEYS[' ']={x:186,y:ys[3]-kh/2,w:268,h:kh,label:'Leerzeichen',type:'sp'};
  KEYS['ret']={x:460,y:ys[3]-kh/2,w:134,h:kh,label:'',type:'s'};
  for(const k in KEYS){ const K=KEYS[k]; K.cx=K.x+K.w/2; K.cy=K.y+K.h/2; }
})();
function keyWorld(ch){ const K=KEYS[ch]||KEYS[ch.toLowerCase()]||KEYS[' ']; return [K.cx/UIW*6.66-3.33, 0, K.cy/UIH*14.16-7.08]; }
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function wrapLines(c, text, maxW){ const words=text.split(' '); const lines=[]; let cur='';
  for(const w of words){ const test=cur? cur+' '+w : w; if(c.measureText(test).width>maxW && cur){ lines.push(cur); cur=w; } else cur=test; }
  lines.push(cur); return lines; }
const PRE='Wenn ich mein Display berühre, ';
function icon(c,k,K){
  c.save(); c.strokeStyle='#fff'; c.fillStyle='#fff'; c.lineWidth=3; c.lineJoin='round'; c.lineCap='round';
  const x=K.cx, y=K.cy;
  if(k==='shift'){ c.beginPath(); c.moveTo(x,y-16); c.lineTo(x+15,y); c.lineTo(x+7,y); c.lineTo(x+7,y+13); c.lineTo(x-7,y+13); c.lineTo(x-7,y); c.lineTo(x-15,y); c.closePath(); c.stroke(); }
  if(k==='back'){ c.beginPath(); c.moveTo(x-20,y); c.lineTo(x-9,y-12); c.lineTo(x+18,y-12); c.lineTo(x+18,y+12); c.lineTo(x-9,y+12); c.closePath(); c.stroke();
    c.beginPath(); c.moveTo(x-1,y-6); c.lineTo(x+10,y+6); c.moveTo(x+10,y-6); c.lineTo(x-1,y+6); c.stroke(); }
  if(k==='emo'){ c.beginPath(); c.arc(x,y,15,0,7); c.stroke(); c.beginPath(); c.arc(x,y+2,8,0.2,Math.PI-0.2); c.stroke(); c.beginPath(); c.arc(x-5,y-5,1.8,0,7); c.arc(x+5,y-5,1.8,0,7); c.fill(); }
  if(k==='ret'){ c.beginPath(); c.moveTo(x+18,y-12); c.lineTo(x+18,y+6); c.lineTo(x-16,y+6); c.stroke(); c.beginPath(); c.moveTo(x-8,y-2); c.lineTo(x-17,y+6); c.lineTo(x-8,y+14); c.stroke(); }
  c.restore();
}
function drawUI(st){
  const c=uc;
  c.fillStyle='#0b0b0c'; c.fillRect(0,0,UIW,UIH);
  c.textBaseline='middle'; c.textAlign='left';
  c.fillStyle='#fff'; c.font='600 27px '+FONT; c.fillText('9:41', 58, 50);
  c.fillStyle='#000'; rr(c,205,24,190,54,27); c.fill();
  c.fillStyle='#fff'; for(let i=0;i<4;i++){ rr(c,438+i*9,58-8-i*5,6,8+i*5,1.5); c.fill(); }
  c.strokeStyle='rgba(255,255,255,0.5)'; c.lineWidth=2; rr(c,486,40,46,22,6); c.stroke();
  c.fillStyle='#fff'; rr(c,490,44,32,14,3); c.fill(); rr(c,534,47,3,8,1); c.fill();
  c.fillStyle='#e8ad2e'; c.font='500 30px '+FONT; c.fillText('‹ Notizen', 18, 122);
  c.font='600 30px '+FONT; c.textAlign='right'; c.fillText('Fertig', 580, 122);
  c.textAlign='center'; c.fillStyle='#8e8e93'; c.font='400 20px '+FONT; c.fillText('12. November 2026 um 09:41', 300, 182);
  c.textAlign='left'; c.fillStyle='#fff'; c.font='700 42px '+FONT;
  c.fillText('Berühren wir überhaupt', 30, 240); c.fillText('etwas?', 30, 292);
  c.font='400 32px '+FONT; c.fillStyle='#e5e5ea';
  const body=PRE+st.typed; const lines=wrapLines(c, body, 540);
  for(let i=0;i<lines.length;i++) c.fillText(lines[i], 30, 372+i*46);
  const ll=lines[lines.length-1]; const lastX=30+c.measureText(ll).width+(body.endsWith(' ')?c.measureText(' ').width:0);
  const ly=372+(lines.length-1)*46;
  if(Math.floor(st.t*1.6)%2===0 || st.typing){ c.fillStyle='#e8ad2e'; c.fillRect(lastX+2, ly-20, 3, 40); }
  c.fillStyle='#232325'; c.fillRect(0,790,UIW,UIH-790);
  for(const k in KEYS){ const K=KEYS[k]; const pressed=st.pressed===k;
    c.fillStyle='rgba(0,0,0,0.55)'; rr(c,K.x,K.y+2,K.w,K.h,9); c.fill();
    c.fillStyle = (K.type==='l'||K.type==='sp') ? (pressed?'#a0a0a6':'#5f5f64') : (pressed?'#8a8a90':'#3c3c3f');
    rr(c,K.x,K.y,K.w,K.h,9); c.fill();
    c.fillStyle='#fff'; c.textAlign='center';
    c.font = K.type==='l' ? '400 34px '+FONT : (K.type==='sp'?'400 24px ':'500 24px ')+FONT;
    if(K.label) c.fillText(K.label, K.cx, K.cy+2); else icon(c,k,K);
  }
  // globe + mic
  c.save(); c.strokeStyle='#9a9aa0'; c.lineWidth=2.5;
  c.beginPath(); c.arc(46,1232,15,0,7); c.stroke(); c.beginPath(); c.ellipse(46,1232,6,15,0,0,7); c.stroke(); c.beginPath(); c.moveTo(31,1232); c.lineTo(61,1232); c.stroke();
  rr(c,549,1216,14,22,7); c.stroke(); c.beginPath(); c.arc(556,1232,11,0.1,Math.PI-0.1); c.stroke(); c.beginPath(); c.moveTo(556,1243); c.lineTo(556,1250); c.stroke();
  c.restore();
  c.fillStyle='rgba(255,255,255,0.85)'; rr(c,200,1258,200,8,4); c.fill();
  if(st.pressed && KEYS[st.pressed] && KEYS[st.pressed].type==='l'){
    const K=KEYS[st.pressed]; const bw=76, bh=96, bx=K.cx-bw/2, by=K.y-bh+18;
    c.fillStyle='rgba(0,0,0,0.45)'; rr(c,bx-1,by+3,bw+2,bh+K.h-14,12); c.fill();
    c.fillStyle='#7c7c82'; rr(c,bx,by,bw,bh,12); c.fill(); rr(c,K.x,K.y+4,K.w,K.h-4,9); c.fill();
    c.fillRect(K.x, by+bh-14, K.w, 30);
    c.fillStyle='#fff'; c.font='400 50px '+FONT; c.textAlign='center'; c.fillText(K.label, K.cx, by+bh/2+4);
  }
}

// ------------------------------------------------------------ finger geometry (mirrors phone.glsl)
const L1=2.3, L2=2.5, L3=9.0;
const HDG=norm([0.42,0,0.91]);
const fdir=deg=>norm(add(mul(HDG,Math.cos(deg*D2R)),[0,Math.sin(deg*D2R),0]));
const FD1=fdir(55), FD2=fdir(33), FD3=fdir(15);
function sdSegJS(p,a,d,L,r0,r1){ const UP=[0,1,0]; const U=norm(sub(UP,mul(d,dot(UP,d))));
  const v=sub(p,a); const h=clamp(dot(v,d),0,L); const c=sub(v,mul(d,h)); const cu=dot(c,U); const e=add(c,mul(U,cu*0.13));
  return (len(e)-lerp(r0,r1,h/L))*0.88; }
function sdFingerJS(p){ const A=[0,0,0]; const J1=mul(FD1,L1); const J2=add(J1,mul(FD2,L2));
  const sm=(a,b,k)=>{const h=clamp(0.5+0.5*(b-a)/k,0,1); return lerp(b,a,h)-k*h*(1-h);};
  return sm(sm(sdSegJS(p,A,FD1,L1,0.66,0.78), sdSegJS(p,J1,FD2,L2,0.78,0.84),0.22), sdSegJS(p,J2,FD3,L3,0.84,0.96),0.28); }
const LOW=(function(){ let best=[0,0,0];
  for(let it=0; it<2; it++){
    const c0=best; const span=it===0?1.2:0.08, step=it===0?0.03:0.002;
    for(let x=-span;x<=span;x+=step) for(let z=-span;z<=span;z+=step){
      let lo=-2, hi=0.5; if(sdFingerJS([c0[0]+x, hi, c0[2]+z])>0 && sdFingerJS([c0[0]+x,-0.0,c0[2]+z])>0) {}
      // find lowest y inside the finger along this vertical line
      let inside=null; for(let y=-1.2;y<=0.6;y+=0.01){ if(sdFingerJS([c0[0]+x,y,c0[2]+z])<0){ inside=y; break; } }
      if(inside===null) continue;
      let a=inside-0.01, b=inside; for(let k=0;k<20;k++){ const m=(a+b)/2; if(sdFingerJS([c0[0]+x,m,c0[2]+z])<0) b=m; else a=m; }
      if(b<best[1]) best=[c0[0]+x,b,c0[2]+z];
    }
  }
  return best; })();
function tipFor(point, gap){ return [point[0]-LOW[0], point[1]+gap-LOW[1], point[2]-LOW[2]]; }

// ------------------------------------------------------------ GL
const glc=document.getElementById('gl');
const gl=glc.getContext('webgl2',{preserveDrawingBuffer:true, antialias:false});
let PM,PP,PD,PQ, texUI, fbA, fbB, fbC;
function prog(fsSrc){
  const vs='#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);
    if(!gl.getShaderParameter(x,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x;}
  const pr=gl.createProgram(); gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fsSrc));
  gl.bindAttribLocation(pr,0,'p'); gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
  const U={}; const n=gl.getProgramParameter(pr,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){ const a=gl.getActiveUniform(pr,i); U[a.name]=gl.getUniformLocation(pr,a.name); }
  return {pr,U};
}
function makeFB(W,H){ W=W||OW; H=H||OH; const tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,W,H,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const fb=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fb); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); return {fb,tex}; }
window.initGL=(macroSrc, phoneSrc, dofSrc, postSrc)=>{
  PM=prog(macroSrc); PP=prog(phoneSrc); PD=prog(dofSrc); PQ=prog(postSrc);
  const bf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,bf); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  texUI=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,texUI);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const ext=gl.getExtension('EXT_texture_filter_anisotropic'); if(ext) gl.texParameterf(gl.TEXTURE_2D, ext.TEXTURE_MAX_ANISOTROPY_EXT, 8);
  fbA=makeFB(MW,MH); fbB=makeFB(); fbC=makeFB();
  return 'ok low='+LOW.map(v=>v.toFixed(3)).join(',');
};
function uploadUI(){ gl.bindTexture(gl.TEXTURE_2D,texUI); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,ui); gl.generateMipmap(gl.TEXTURE_2D); }
function pass(P, target, set, W, H){ gl.bindFramebuffer(gl.FRAMEBUFFER, target); gl.viewport(0,0,W||OW,H||OH); gl.useProgram(P.pr); set(P.U); gl.drawArrays(gl.TRIANGLES,0,3); }

// ------------------------------------------------------------ timeline
const D0=0.024;
const T_ZIN0=5.2, T_ZIN1=6.4, T_MAC1=41.0, T_ZOUT0=47.3, T_ZOUT1=49.3, T_CROSS0=51.4, T_CROSS1=57.4, TYPE_T0=58.2, TYPE_DT=0.13;
const N_END=26.13;
const DIVE0=5.0, DIVE1=6.0, XF_IN0=6.0, XF_IN1=6.5, XF_OUT0=49.05, XF_OUT1=49.5;
const MAC=(function(){ const N=4000, arr=[0]; let s=0; const rate=u=> u<0.8?1: 1-0.85*sstep(0.8,1.0,u);
  for(let i=1;i<=N;i++){ s+=rate(i/N)/N; arr.push(s);} return arr.map(v=>v/s); })();
function macroN(t){ const u=clamp((t-T_ZIN1)/(T_MAC1-T_ZIN1),0,1)*4000; const a=Math.floor(u), b=Math.min(a+1,4000); return 1.5+24.5*lerp(MAC[a],MAC[b],u-a); }
// real distance (halvings)
function nReal(t){
  if(t<T_ZIN0) return 1.0*Math.pow(t/T_ZIN0,1.3);
  if(t<T_ZIN1) return 1.0+0.5*(t-T_ZIN0)/(T_ZIN1-T_ZIN0);
  if(t<T_MAC1) return macroN(t);
  const u=t-T_MAC1; return 26 + 0.17*sstep(0.0,1.6,u) - 0.04*sstep(1.6,3.0,u);
}
// view scale (halvings) for the macro shader
function nView(t){
  if(t<T_ZOUT0) return nReal(t);
  return lerp(N_END, 1.3, easeIO((t-T_ZOUT0)/(T_ZOUT1-T_ZOUT0)));
}
const distM=n=>D0*Math.pow(2,-n);
function fmtDist(m){ let v,u; if(m>=1e-2){v=m*100;u='cm';} else if(m>=1e-3){v=m*1e3;u='mm';} else if(m>=1e-6){v=m*1e6;u='µm';} else {v=m*1e9;u='nm';}
  const s = v>=100? v.toFixed(0) : v>=10? v.toFixed(1) : v>=1 ? v.toFixed(2) : v.toFixed(3); return s.replace('.',',')+' '+u; }
const UPL=[[-99,'deine Fingerkuppe'],[2,'Fingerabdruck-Rillen'],[6.2,'abgestorbene Hautzellen'],[10.0,'Oberfläche einer Hautzelle'],[14.0,'Keratin-Fasern'],[18.3,'Keratin-Moleküle'],[22.6,'Atome des Keratins'],[25.6,'Elektronenwolken']];
const LOL=[[-99,'die Taste J'],[4.3,'Pixel unter dem Glas'],[7.3,'Hautfett vom Wischen'],[9.8,'Kratzer, die du nie siehst'],[12.1,'poliertes Glas'],[16.0,'Anti-Fett-Beschichtung'],[19.5,'Fluor-Polymerketten'],[22.6,'Fluor-Atome'],[25.6,null]];
const pick=(L,n)=>{let r=L[0][1]; for(const e of L) if(n>=e[0]) r=e[1]; return r;};

// typing
const TYPE_TXT='berühren sich die Atome nie';
function typingText(t){ if(t<TYPE_T0) return ''; const i=Math.floor((t-TYPE_T0)/TYPE_DT); return TYPE_TXT.slice(0, clamp(i+1,0,TYPE_TXT.length)); }
function fingerTyping(t){
  const n=TYPE_TXT.length; const J=keyWorld('j');
  const keyAt=i=>{ if(i<0) return J; if(i>=n) return add(keyWorld('l'),[0.3,0,0.5]); return keyWorld(TYPE_TXT[i]); };
  const u=(t-TYPE_T0)/TYPE_DT;
  if(u < -1){ // lifting from J before typing starts
    const g = 0.55*ease((t-(T_CROSS1-0.2))/0.6);
    return {pt:J, gap:g, key: g<0.02?'j':null};
  }
  if(u > n-1){ const a=keyAt(n-1), b=keyAt(n); const v=ease((u-(n-1))/4); return {pt:lerp3(a,b,v), gap:0.9*ease((u-(n-1))/2.5), key:(u-(n-1))<0.08?TYPE_TXT[n-1].toLowerCase():null}; }
  const i=Math.ceil(u+1e-9); const fr=u-(i-1);
  const a=keyAt(i-1), b=keyAt(i);
  const m=sstep(0.12,0.82,fr);
  const gap = i===0 ? 0.55*Math.pow(Math.cos(clamp(fr,0,1)*Math.PI/2),0.7) : 0.5*Math.pow(Math.sin(Math.PI*clamp(fr,0,1)),0.85);
  let key=null; const ci = fr<0.1? i-1 : (fr>0.9? i : -1);
  if(ci>=0 && ci<n){ const c=TYPE_TXT[ci]; key = c===' '?' ':c.toLowerCase(); }
  return {pt:lerp3(a,b,m), gap, key};
}

// cameras
function camLook(target, dist, elDeg, azDeg, fov){
  const el=elDeg*D2R, az=azDeg*D2R;
  const dir=[Math.sin(az)*Math.cos(el), Math.sin(el), Math.cos(az)*Math.cos(el)];
  const pos=add(target, mul(dir,dist));
  const fw=norm(sub(target,pos)); const rt=norm(cross(fw,[0,1,0])); const up=cross(rt,fw);
  return {pos,fw,rt,up,f:1/Math.tan(fov*D2R/2), target, dist};
}
function lerpCam(A,B,u){ return { t:lerp3(A.t,B.t,u), d:loglerp(A.d,B.d,u), el:lerp(A.el,B.el,u), az:lerp(A.az,B.az,u),
  fov: 2*Math.atan(loglerp(Math.tan(A.fov*D2R/2),Math.tan(B.fov*D2R/2),u))/D2R }; }
const mkCam=c=>camLook(c.t,c.d,c.el,c.az,c.fov);
function project(cam, X){ const v=sub(X,cam.pos); const z=dot(v,cam.fw); return [OW/2 + dot(v,cam.rt)/z*cam.f*OH/2, OH/2 - dot(v,cam.up)/z*cam.f*OH/2]; }
const A_END=-42;
const matched=(dcm)=>({t:add(keyWorld('j'),[0,dcm/2,0]), d:1.5*dcm, el:0, az:A_END, fov:84.9});

function phoneState(t){
  const J=keyWorld('j');
  if(t < 30){
    const n=nReal(t), dcm=distM(n)*100;
    const u=clamp(t/DIVE0,0,1);

  vignette(0.42);
  // intro
  if(t<T_ZIN1){
    caption(['Wie nah kommt dein Finger','wirklich an dein Display?'], 300, fadeWin(t,0.25,5.1,0.45));
    const a=sstep(0.6,1.1,t)*(1-sstep(DIVE0-0.3,DIVE0+0.1,t));
    if(a>0){ const J=keyWorld('j'); const p1=project(ps.cam,[J[0],ps.dcm,J[2]]), p2=project(ps.cam,J);
      measure(p1[0], p1[1], p2[1], fmtDist(distM(n)), halvTxt(n), 'deine Fingerkuppe', 'die Taste J', a, 0.85); }
  }
  // macro measurement
  if(t>6.2 && t<T_ZOUT0+0.1){
    const a = sstep(6.35,6.75,t)*(1-sstep(T_ZOUT0-0.35,T_ZOUT0,t));
    const gm=macroGeom(n,1,false); const SC=0.546875*OH;
    const yT=gm.ysT, yL=gm.yL;
    measure(OW/2, OH/2-yT*SC, OH/2+yL*SC, fmtDist(distM(n)), halvTxt(n), pick(UPL,n), pick(LOL,n), a, 1);
  }
  if(t>41 && t<T_ZOUT0+0.2){
    caption(['Sie berühren sich nie.'], 1480, fadeWin(t,41.7,T_ZOUT0,0.4), 60);
    caption(['Ihre Elektronen stoßen sich ab.'], 1562, fadeWin(t,43.0,T_ZOUT0,0.4), 44);
  }
  // back on the phone
  if(t>=T_ZOUT1 && t<T_CROSS0+0.2){
    const J=keyWorld('j'); const P=project(ps.cam,[J[0],0,J[2]]);
    const a=sstep(50.0,50.4,t)*(1-sstep(T_CROSS0-0.3,T_CROSS0,t));
    oc.save(); oc.globalAlpha=a; oc.strokeStyle='rgba(255,255,255,0.92)'; oc.lineWidth=2.5;
    oc.beginPath(); oc.arc(P[0],P[1],5,0,7); oc.stroke();
    oc.beginPath(); oc.moveTo(P[0]+5,P[1]+5); oc.lineTo(P[0]+60,P[1]+95); oc.lineTo(P[0]+86,P[1]+95); oc.stroke();
    oc.fillStyle='#fff'; oc.font='700 42px '+FONT; oc.textAlign='left'; shadowText(oc,'immer noch 0,322 nm', P[0]-30, P[1]+148, 10);
    oc.font='500 32px '+FONT; shadowText(oc,'Abstand', P[0]-30, P[1]+190, 10); oc.restore();
    caption(['Du hast dein Handy','noch nie berührt.'], 300, fadeWin(t,49.6,T_CROSS0,0.35));
  }
  if(vis.cr>0){
    caption(['Aber woher weiß dein Handy,','wo du tippst?'], 300, vis.cr*fadeWin(t,51.6,53.4,0.3), 56);
    caption(['Unter dem Glas liegt','ein Sensor-Gitter.'], 300, vis.cr*fadeWin(t,53.4,55.3,0.3), 56);
    caption(['Es misst, wie dein Finger','das elektrische Feld verändert.'], 300, vis.cr*fadeWin(t,55.3,T_CROSS1+0.2,0.3), 52);
  }
  if(t>61.8){
    caption(['Du hast es nie berührt.'], 880, sstep(62.0,62.5,t), 66);
    caption(['Es hat dich nur gespürt.'], 970, sstep(62.6,63.1,t), 66);
  }
  return n;
};
window.events=()=>{
  const ev={ticks:[], taps:[]}; let last=0;
  for(let t=0;t<T_MAC1+0.5;t+=1/240){ const k=Math.floor(nReal(t)+1e-9); if(k>last){ ev.ticks.push([+t.toFixed(4),k]); last=k; } }
  for(let i=0;i<TYPE_TXT.length;i++) ev.taps.push(+(TYPE_T0+i*TYPE_DT).toFixed(4));
  ev.T={ZIN0:T_ZIN0,ZIN1:T_ZIN1,MAC1:T_MAC1,ZOUT0:T_ZOUT0,ZOUT1:T_ZOUT1,CROSS0:T_CROSS0,CROSS1:T_CROSS1,TYPE0:TYPE_T0};
  return ev;
};
</script>
